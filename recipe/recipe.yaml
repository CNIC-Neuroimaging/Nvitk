# rattler-build recipe for nvitk.
#
# Dependency split mirrors what pyproject.toml's own [tool.pixi.*] tables already prove
# works in production: pixi treats [project.dependencies] and the `gui` extra as PyPI
# dependencies by default, and only overrides a small set of names to conda-native
# sourcing — mrtrix3/freeimage/libstdcxx-ng (`[tool.pixi.dependencies]`), python/numpy
# (`[tool.pixi.feature.gpu.dependencies]`), the R stack + rpy2
# (`[tool.pixi.feature.stats.dependencies]`), and the Qt/GUI stack (pyqt6/napari/qtpy
# here; PyQt6-WebEngine alone stays pip-only in post-link.sh until conda-forge ships
# it). Everything else stays pip-only.
#
# `version` is kept in manual sync with [project].version in ../pyproject.toml (that
# field is static there, not setuptools_scm-driven).
context:
  version: "0.1.0"

package:
  name: nvitk
  version: ${{ version }}

source:
  path: ../

build:
  number: 1
  noarch: python
  script:
    - pip install . --no-deps -vv
    # Unlike classic conda-build, rattler-build does NOT wire up post-link.sh /
    # pre-unlink.sh by filename convention alone — the build script must copy them
    # into $PREFIX/bin/ under the exact hidden-file naming conda's linker looks for
    # (verified against a failed local install where these never ran otherwise).
    - mkdir -p "$PREFIX/bin"
    - cp "$RECIPE_DIR/post-link.sh" "$PREFIX/bin/.nvitk-post-link.sh"
    - cp "$RECIPE_DIR/pre-unlink.sh" "$PREFIX/bin/.nvitk-pre-unlink.sh"
    - chmod +x "$PREFIX/bin/.nvitk-post-link.sh" "$PREFIX/bin/.nvitk-pre-unlink.sh"
    # Activation hooks: prepend $CONDA_PREFIX/lib to LD_LIBRARY_PATH so conda Qt/font
    # libraries win over HPC module paths (see activate.d/nvitk-gui.sh).
    - mkdir -p "$PREFIX/etc/conda/activate.d" "$PREFIX/etc/conda/deactivate.d"
    - cp "$RECIPE_DIR/activate.d/nvitk-gui.sh" "$PREFIX/etc/conda/activate.d/nvitk-gui.sh"
    - cp "$RECIPE_DIR/deactivate.d/nvitk-gui.sh" "$PREFIX/etc/conda/deactivate.d/nvitk-gui.sh"
    - chmod +x "$PREFIX/etc/conda/activate.d/nvitk-gui.sh" "$PREFIX/etc/conda/deactivate.d/nvitk-gui.sh"

requirements:
  host:
    - python ==3.11.15
    - pip
    - setuptools >=61.0
    - wheel
    - setuptools_scm >=6.0
  run:
    # pip itself must be present at runtime for post-link.sh / pre-unlink.sh to use.  
    # - conda-forge::pip
    - pip
    # ── Conda-native core ([tool.pixi.feature.gpu.dependencies]) ────
    - python ==3.11.15
    - numpy ==2.3.3
    - dvc ==3.67.1
    # ── Stats / R ([tool.pixi.feature.stats.dependencies];
    #    pymer4/great-tables/formulae stay pip-only, see post-link.sh) ───────
    - r-base ==4.5.3
    - rpy2 ==3.6.7
    - r-lme4 ==2.0_6
    - r-lmertest ==3.2_1
    - r-mmrm ==0.3.18
    - r-emmeans ==2.0.4
    - r-parameters ==0.29.2
    - r-performance ==0.17.1
    - r-report ==0.6.4
    - r-tibble ==3.3.1
    - r-broom ==1.0.13
    - r-broom.mixed ==0.2.9.7
    - r-insight ==1.5.2
    - r-robustbase ==0.99_7
    # ── Conda-only extras ([tool.pixi.dependencies]) ────────
    # - mrtrix3::mrtrix3 ==3.0.8
    - freeimage ==3.18.0
    - libstdcxx-ng ==15.2.0
    # ── GUI ([project.optional-dependencies].gui; Qt from conda-forge for a
    #    consistent harfbuzz/freetype stack — PyQt6-WebEngine stays pip-only in
    #    post-link.sh until conda-forge ships pyqt6-webengine) ───────────────
    - pyqt6 ==6.11.0
    - qt6-main ==6.11.0
    - qtpy ==2.4.3
    - napari ==0.7.0
    - magicgui ==0.10.2
    - superqt ==0.8.2

tests:
  # A real `import nvitk` needs the pip-only packages post-link.sh installs, which
  # rattler-build's test harness doesn't run (it only installs requirements/run).
  # find_spec locates the module without executing its __init__.py, so this checks
  # the package actually landed on-disk without requiring the full pip-only stack.
  # The real end-to-end import check happens in CI / local verification via an
  # actual `conda install`, which does trigger post-link.sh.
  - script:
      - python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('nvitk') else 1)"

about:
  homepage: https://github.com/ignacio-ms/Nvitk
  summary: Neuro-Vascular Imaging ToolKit
  description: |
    Research toolkit for neurological and vascular biomedical image processing
    (CT, PET, MRI/MRA) — I/O, filtering, restoration, segmentation, registration,
    imaging metrics, mesh reconstruction, statistics, and full research pipelines.
  license: MIT
  license_file: LICENSE
