<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>CViT architecture</title>
  <desc>A hierarchical convolutional tokenizer (S0 to S3) produces multi-scale features; the deepest is projected to tokens for a transformer encoder; a U-Net decoder (D3 to D0) fuses the transformer output with the conv features through gated, droppable skip connections and emits deep-supervision heads. A separate pre-training head reconstructs masked tokens.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fbf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; fill: #111827; }
      .s  { font-size: 12px; fill: #374151; }
      .lab{ font-size: 12px; fill: #6b7280; }
      .hd { font-size: 13px; font-weight: 600; fill: #6b7280; letter-spacing: .04em; }
      .gray  { fill: #eef0f3; stroke: #9aa1ab; }
      .blue  { fill: #dbe9fb; stroke: #4f86c6; }
      .teal  { fill: #d6f1e8; stroke: #2f9e7a; }
      .purple{ fill: #e7e4fb; stroke: #6c62c8; }
      .amber { fill: #fbecd4; stroke: #c48a2c; }
    </style>
  </defs>

  <text class="hd" x="150" y="28" text-anchor="middle">CONV TOKENIZER</text>
  <text class="hd" x="570" y="28" text-anchor="middle">U-NET DECODER</text>

  <!-- input / output -->
  <rect class="gray" x="50" y="40" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="62" text-anchor="middle">Input volume</text>
  <text class="s" x="150" y="80" text-anchor="middle">C_in × 128³</text>
  <rect class="gray" x="470" y="40" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="62" text-anchor="middle">Logits</text>
  <text class="s" x="570" y="80" text-anchor="middle">K × 128³ (+ deep supervision)</text>

  <!-- tokenizer -->
  <rect class="blue" x="50" y="110" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="132" text-anchor="middle">S0 · ResBlock, stride 1</text>
  <text class="s" x="150" y="150" text-anchor="middle">F0: 32 × 128³</text>
  <rect class="blue" x="50" y="180" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="202" text-anchor="middle">S1 · ResBlock, stride 2</text>
  <text class="s" x="150" y="220" text-anchor="middle">F1: 64 × 64³</text>
  <rect class="blue" x="50" y="250" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="272" text-anchor="middle">S2 · ResBlock ×2, stride 2</text>
  <text class="s" x="150" y="290" text-anchor="middle">F2: 128 × 32³</text>
  <rect class="blue" x="50" y="320" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="342" text-anchor="middle">S3 · ResBlock ×2, stride 2</text>
  <text class="s" x="150" y="360" text-anchor="middle">F3: 256 × 16³</text>
  <rect class="blue" x="50" y="390" width="200" height="52" rx="6"/>
  <text class="t" x="150" y="412" text-anchor="middle">1×1 proj → tokens</text>
  <text class="s" x="150" y="430" text-anchor="middle">N = 4096 × E, + pos-embed</text>

  <!-- decoder -->
  <rect class="teal" x="470" y="110" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="132" text-anchor="middle">D0 · up×2 ⊕ F0</text>
  <text class="s" x="570" y="150" text-anchor="middle">32 × 128³ → seg head</text>
  <rect class="teal" x="470" y="180" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="202" text-anchor="middle">D1 · up×2 ⊕ F1</text>
  <text class="s" x="570" y="220" text-anchor="middle">64 × 64³ · DS head 1/2</text>
  <rect class="teal" x="470" y="250" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="272" text-anchor="middle">D2 · up×2 ⊕ F2</text>
  <text class="s" x="570" y="290" text-anchor="middle">128 × 32³ · DS head 1/4</text>
  <rect class="teal" x="470" y="320" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="342" text-anchor="middle">D3 · fuse T ⊕ F3</text>
  <text class="s" x="570" y="360" text-anchor="middle">256 × 16³</text>
  <rect class="teal" x="470" y="390" width="200" height="52" rx="6"/>
  <text class="t" x="570" y="412" text-anchor="middle">Reshape to grid</text>
  <text class="s" x="570" y="430" text-anchor="middle">T: E × 16³</text>

  <!-- transformer -->
  <rect class="purple" x="50" y="465" width="620" height="70" rx="6"/>
  <text class="t" x="360" y="491" text-anchor="middle">Transformer encoder × L — global attention over conv tokens</text>
  <text class="s" x="360" y="514" text-anchor="middle">pre-norm · SDPA / flash · 3D RoPE · SwiGLU · LayerScale · DropPath · optional registers</text>

  <!-- SSL head -->
  <rect class="amber" x="50" y="565" width="620" height="56" rx="6"/>
  <text class="t" x="360" y="588" text-anchor="middle">Self-supervised pre-training (nnssl): SimMIM / MAE</text>
  <text class="s" x="360" y="607" text-anchor="middle">mask tokens + zero masked voxels → encoder → patch decoder (no skips) · tokenizer + encoder transfer</text>

  <!-- main flow -->
  <g fill="none" stroke="#6b7280" stroke-width="1.6">
    <line x1="150" y1="92"  x2="150" y2="108" marker-end="url(#a)"/>
    <line x1="150" y1="162" x2="150" y2="178" marker-end="url(#a)"/>
    <line x1="150" y1="232" x2="150" y2="248" marker-end="url(#a)"/>
    <line x1="150" y1="302" x2="150" y2="318" marker-end="url(#a)"/>
    <line x1="150" y1="372" x2="150" y2="388" marker-end="url(#a)"/>
    <line x1="150" y1="442" x2="150" y2="463" marker-end="url(#a)"/>
    <line x1="570" y1="465" x2="570" y2="444" marker-end="url(#a)"/>
    <line x1="570" y1="390" x2="570" y2="374" marker-end="url(#a)"/>
    <line x1="570" y1="320" x2="570" y2="304" marker-end="url(#a)"/>
    <line x1="570" y1="250" x2="570" y2="234" marker-end="url(#a)"/>
    <line x1="570" y1="180" x2="570" y2="164" marker-end="url(#a)"/>
    <line x1="570" y1="110" x2="570" y2="94"  marker-end="url(#a)"/>
    <line x1="360" y1="535" x2="360" y2="563" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>

  <!-- skips -->
  <g fill="none" stroke="#2f6fbf" stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="250" y1="136" x2="468" y2="136" marker-end="url(#b)"/>
    <line x1="250" y1="206" x2="468" y2="206" marker-end="url(#b)"/>
    <line x1="250" y1="276" x2="468" y2="276" marker-end="url(#b)"/>
    <line x1="250" y1="346" x2="468" y2="346" marker-end="url(#b)"/>
  </g>
  <text class="lab" x="359" y="128" text-anchor="middle">skip F0 · gate · drop · scale</text>
  <text class="lab" x="359" y="198" text-anchor="middle">skip F1</text>
  <text class="lab" x="359" y="268" text-anchor="middle">skip F2</text>
  <text class="lab" x="359" y="338" text-anchor="middle">skip F3</text>

  <text class="lab" x="360" y="660" text-anchor="middle">Example: 1-channel 128³ patch, CViT-B, token stride 8. Strides are per axis (anisotropic plans use e.g. 1×2×2).</text>
</svg>
