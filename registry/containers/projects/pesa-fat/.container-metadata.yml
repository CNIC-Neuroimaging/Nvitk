name: pesa-fat
display_name: "PESA-FAT Analysis Pipeline"
type: project
description: |
  Complete pipeline for PESA-FAT (Progression of Early Subclinical Atherosclerosis - 
  Fat Analysis Tool) analysis including tissue segmentation and fat quantification.

maintainers:
  - name: Ignacio Marcos Serrano
    email: imarcoss@cnic.es

base_image: gpu-base
gpu_required: true
min_gpu_memory_gb: unknown

dependencies:
  base_container: gpu-base
  models:
    - name: totalsegmentator-v2
      version: ">=2.0.0"
      required: true
      location: "/ia_models/imaging/totalsegmentator/totalsegmentator-v2"

runtime:
  bind_mounts:
    - source: /ia_models
      target: /models
      required: true
      description: "Model weights directory"
    
    - source: /data
      target: /data
      required: false
      description: "Input data directory"
  
  env_vars:
    TOTALSEG_HOME_DIR: "/models/imaging/totalsegmentator/totalsegmentator-v2"
    MODEL_REGISTRY: "/models"

usage:
  examples:
    - description: "Run PESA-FAT analysis pipeline"
      command: |
        TBA

notes: |
  This container requires access to TotalSegmentator model weights.
  Ensure /ia_models is properly mounted to /models inside the container.

tags:
  - segmentation
  - fat-analysis
  - mri
  - medical-imaging
  - pesa

