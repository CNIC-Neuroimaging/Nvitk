name: TopCoW-CLAIM
display_name: "TopCoW Circle of Willis Segmentation - CLAIM"
type: project
external: true
description: |
  TopCoW (Topology-preserving anatomical segmentation of the Circle of Willis) 
  for automated segmentation of the Circle of Willis from MR angiography.
  
  This is the CLAIM Team variant.
  
  This is an externally-built container (no source .def file available).

maintainers:
  - name: BioImaging Team
    email: imarcoss@cnic.es

source:
  type: external
  origin: "Pre-built container from TopCoW challenge"
  variant: "CLAIM Team"
  available_versions:
    - v2025.10.10

base_image: unknown
gpu_required: true
min_gpu_memory_gb: unknown

capabilities:
  - Circle of Willis segmentation
  - Vascular segmentation from MRA
  - Topology-preserving segmentation

runtime:
  bind_mounts:
    - source: /data
      target: /data
      required: true
      description: "Input MRA data directory"
    
    - source: /results
      target: /results
      required: false
      description: "Output directory"
  
  env_vars: {}

usage:
  examples:
    - description: "Run TopCoW-CLAIM segmentation"
      command: |
        TBA

notes: |
  This is an external container without source definition files.
  
  TopCoW-CLAIM is an CLAIM Team variant of TopCoW for Circle of Willis
  segmentation.
  
  Requires GPU for optimal performance.

tags:
  - neuroimaging
  - vascular-segmentation
  - circle-of-willis
  - mra
  - cta
  - external
  - gpu

