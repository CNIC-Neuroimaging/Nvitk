# GitLab CI Pipeline for Apptainer Definition Validation
# Purpose: Validate syntax and structure of .def files without building containers
# Note: This CI does NOT build or store container images

stages:
  - validate
  - lint

variables:
  GIT_DEPTH: 10

# Validate all .def files for basic syntax and structure
validate_definitions:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep coreutils
  script:
    - echo "🔍 Scanning for .def files..."
    - find . -name "*.def" -type f | tee def_files.txt
    - |
      if [ ! -s def_files.txt ]; then
        echo "❌ No .def files found"
        exit 1
      fi
    - echo "✅ Found $(wc -l < def_files.txt) definition file(s)"
    
    # Validate each .def file
    - |
      echo ""
      echo "🧪 Validating definition files..."
      FAILED=0
      while IFS= read -r deffile; do
        echo ""
        echo "📄 Validating: $deffile"
        
        # Check file is not empty
        if [ ! -s "$deffile" ]; then
          echo "  ❌ File is empty"
          FAILED=$((FAILED + 1))
          continue
        fi
        
        # Check for required Bootstrap directive
        if ! grep -q "^Bootstrap:" "$deffile"; then
          echo "  ❌ Missing Bootstrap directive"
          FAILED=$((FAILED + 1))
          continue
        fi
        
        # Check for required From directive
        if ! grep -q "^From:" "$deffile"; then
          echo "  ❌ Missing From directive"
          FAILED=$((FAILED + 1))
          continue
        fi
        
        # Check for at least one section (%, like %post, %environment, etc.)
        if ! grep -q "^%[a-z]" "$deffile"; then
          echo "  ⚠️  Warning: No definition sections found (e.g., %post, %environment)"
        fi
        
        # Validate section syntax
        INVALID_SECTIONS=$(grep -E "^%[^a-z]|^%$" "$deffile" || true)
        if [ -n "$INVALID_SECTIONS" ]; then
          echo "  ❌ Invalid section syntax detected:"
          echo "$INVALID_SECTIONS" | sed 's/^/    /'
          FAILED=$((FAILED + 1))
          continue
        fi
        
        echo "  ✅ Valid structure"
      done < def_files.txt
      
      echo ""
      if [ $FAILED -gt 0 ]; then
        echo "❌ Validation failed: $FAILED file(s) with errors"
        exit 1
      else
        echo "✅ All definition files passed validation"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Check for common issues and best practices
lint_definitions:
  stage: lint
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep
  script:
    - echo "🔍 Linting definition files for best practices..."
    - |
      WARNINGS=0
      while IFS= read -r deffile; do
        echo ""
        echo "📄 Linting: $deffile"
        
        # Check for absolute paths in %files section
        if grep -A 20 "^%files" "$deffile" | grep -E "^\s*/home/|^\s*/Users/" > /dev/null; then
          echo "  ⚠️  Warning: Absolute local paths detected in %files section"
          echo "      Consider documenting these as prerequisites"
          WARNINGS=$((WARNINGS + 1))
        fi
        
        # Check for hardcoded user paths
        if grep -E "/home/[a-z]+/|/Users/[a-zA-Z]+" "$deffile" > /dev/null; then
          echo "  ⚠️  Warning: User-specific paths detected (e.g., /home/username/)"
          WARNINGS=$((WARNINGS + 1))
        fi
        
        # Check for missing runscript or startscript
        if ! grep -q "^%runscript" "$deffile" && ! grep -q "^%startscript" "$deffile"; then
          echo "  ℹ️  Info: No %runscript or %startscript defined"
        fi
        
        # Check for unset variables in %post
        if grep -A 100 "^%post" "$deffile" | grep -E '\$[A-Z_]+' | grep -v "export" | head -1 > /dev/null; then
          echo "  ℹ️  Info: Variables used in %post - ensure they are properly set"
        fi
        
        echo "  ✅ Linting complete"
      done < <(find . -name "*.def" -type f)
      
      echo ""
      if [ $WARNINGS -gt 0 ]; then
        echo "⚠️  Linting completed with $WARNINGS warning(s)"
        echo "    (Warnings do not fail the pipeline)"
      else
        echo "✅ No linting issues found"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

# Check for large files that shouldn't be committed
check_no_containers:
  stage: validate
  image: alpine:latest
  script:
    - echo "🔍 Checking for accidentally committed container files..."
    - |
      FOUND_CONTAINERS=$(find . -type f \( -name "*.sif" -o -name "*.simg" -o -name "*.img" \) || true)
      if [ -n "$FOUND_CONTAINERS" ]; then
        echo "❌ Container files detected in repository:"
        echo "$FOUND_CONTAINERS"
        echo ""
        echo "This repository should only contain definition files, not built containers."
        exit 1
      else
        echo "✅ No container files found"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
