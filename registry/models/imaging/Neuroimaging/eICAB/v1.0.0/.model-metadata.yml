name: eicab
version: "1.0.0"
display_name: "eICAB v1 - Circle of Willis Segmentation"

type: segmentation
framework: pytorch
domain: neuroimaging

description: >
  Express Intracranial Arteries Breakdown (eICAB) v1 for automated segmentation
  of Circle of Willis from MR angiography (MRA) images. Original version with 
  the exact weights presented in the eICAB paper, trained on 116 subjects. 
  Deprecated in favor of v2.0.0.

