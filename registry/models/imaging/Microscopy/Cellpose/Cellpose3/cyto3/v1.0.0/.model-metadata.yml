name: cellpose3-cyto3
version: "1.0.0"
display_name: "Cellpose3 Cyto3 - Cell Segmentation"

type: segmentation
framework: pytorch
domain: microscopy

description: >
  Cellpose3 cyto3 model for general instance cell segmentation in microscopy images.
  Pretrained on diverse cell types including mammalian cells, yeast, and bacteria.
  Suitable for 2D and 3D segmentation tasks.

weights:
  location: /run/user/11503/gvfs/smb-share:server=tierra.cnic.es,share=sc/LAB_FSC/LAB/PERSONAL/imarcoss/ai_models/imaging/Microscopy/Cellpose/Cellpose3/cyto3/v1.0.0
  files:
    - cyto3
  config_files: []
  size_mb: 26

compatible_containers:
  - unknown

source:
  type: pretrained
  origin: "Cellpose official"
  url: "https://cellpose.readthedocs.io/en/v3.1.1.1/models.html"
  license: "CC-BY-NC 4.0 International license"

usage:
  command_example: |
    from cellpose import models
    model = models.Cellpose(gpu=True, model_type='/path/to/cyto3')
    masks, flows, style, diams = model.eval(imgs, diameter=30)
  
  input_format: "2D/3D microscopy images (grayscale or RGB)"
  output_format: "Integer segmentation masks (0=background, 1,2,3...=cells)"

maintainers:
  - name: BioImaging Team
    email: imarcoss@cnic.es

tags:
  - instance-segmentation
  - cell-segmentation
  - microscopy
  - cellpose

performance:
  metrics: unknown
  gpu_memory_mb: unknown
  inference_time_ms: unknown

training:
  dataset: "Cellpose3 official training dataset"
  framework_version: unknown

