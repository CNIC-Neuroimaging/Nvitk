# GitLab CI Pipeline for Model Repository Validation
# Purpose: Validate repository structure and documentation
# Note: Does NOT validate model files themselves

stages:
  - validate

variables:
  GIT_DEPTH: 10
  GIT_LFS_SKIP_SMUDGE: "1"  # Skip downloading LFS files in CI

# Validate repository structure
validate_structure:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache bash tree
  script:
    - echo "🔍 Validating repository structure..."
    
    # Check that each model directory has a README
    - |
      echo ""
      echo "📄 Checking for README files in model directories..."
      MISSING_READMES=0
      for dir in cellpose3 eicab retfound topcow totalsegmentator vascx; do
        if [ -d "$dir" ]; then
          if [ ! -f "$dir/README.md" ]; then
            echo "  ❌ Missing README.md in $dir/"
            MISSING_READMES=$((MISSING_READMES + 1))
          else
            echo "  ✅ $dir/README.md exists"
          fi
        fi
      done
      
      if [ $MISSING_READMES -gt 0 ]; then
        echo ""
        echo "❌ Found $MISSING_READMES directories without README.md"
        exit 1
      fi
    
    - echo ""
    - echo "✅ Repository structure validation passed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Check Git LFS configuration
check_lfs_config:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache bash grep
  script:
    - echo "🔍 Checking Git LFS configuration..."
    
    - |
      if [ ! -f ".gitattributes" ]; then
        echo "❌ .gitattributes file not found"
        echo "   Git LFS requires .gitattributes for tracking large files"
        exit 1
      fi
    
    - |
      echo ""
      echo "📄 Checking .gitattributes content..."
      if ! grep -q "filter=lfs" .gitattributes; then
        echo "⚠️  Warning: No LFS filters found in .gitattributes"
        echo "   Model files may not be tracked by LFS"
      else
        echo "✅ Git LFS configuration found"
        echo ""
        echo "Tracked extensions:"
        grep "filter=lfs" .gitattributes | awk '{print "  - " $1}'
      fi
    
    - echo ""
    - echo "✅ Git LFS check completed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

# List large files that should be tracked by LFS
check_large_files:
  stage: validate
  image: alpine:latest
  script:
    - echo "🔍 Scanning for large files..."
    - |
      # Find files larger than 10MB (excluding .git directory)
      LARGE_FILES=$(find . -type f -size +10M ! -path "./.git/*" || true)
      
      if [ -n "$LARGE_FILES" ]; then
        echo "⚠️  Found files larger than 10MB:"
        echo "$LARGE_FILES" | while read file; do
          SIZE=$(du -h "$file" | cut -f1)
          echo "  - $file ($SIZE)"
        done
        echo ""
        echo "ℹ️  Large files should be tracked with Git LFS"
        echo "   Check .gitattributes configuration"
      else
        echo "✅ No large files found (or all tracked by LFS)"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true
