# ──────────────────────────────────────────────────────────────────────────────
# Project configuration
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvitk"
version = "0.1.0"
description = "Neuro-Vascular Imaging ToolKit"
authors = [
  { name = "Ignacio Marcos Serrano", email = "imarcoss@cnic.es" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["3D", "biomedical", "mesh", "imaging", "neuroimaging", "vascular", "mri", "ct", "pet"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: Open Source"
]

# ──────────────────────────────────────────────────────────────────────────────
# Dependencies
# ──────────────────────────────────────────────────────────────────────────────
dependencies = [
  # -----------------------------------------------------------------------------
  # Core dependencies
  # -----------------------------------------------------------------------------
  "numpy>=2.3.3",
  "scipy>=1.15.3",
  "click>=8.2.1",
  "openpyxl>=3.1.5",
  "seaborn>=0.13.2",
  "pandas>=2.3.2",
  "pyarrow>=21.0.0",
  "debugpy>=1.8.16",
  "jupyter>=1.1.1",
  "pingouin>=0.6.1",

  # -----------------------------------------------------------------------------
  # Image processing dependencies
  # -----------------------------------------------------------------------------
  "nibabel>=5.3.2",
  "nilearn>=0.10.4",
  "tifffile>=2025.5.26",
  "pillow>=11.0.0",
  "imageio>=2.37.0",
  "nd2>=0.10.3",
  "antspyx>=0.6.1",
  "dicom2nifti>=2.6.1",
  "pydicom>=2.4.5,<=3",
  # "pydicom>=3.0.1",
  "pylibjpeg>=2.0.1",
  "vtk>=9.3.1",
  # "pyradiomics>=3.0.1",
  "SimpleITK>=2.5.2",
  "scikit-image>=0.25.2",
  "opencv-python>=4.11",
  
  "totalsegmentator>=2.11.0",
  "nnunetv2>=2.6.2",

  "nilearn>=0.11.0",

  # -----------------------------------------------------------------------------
  # Mesh processing dependencies
  # -----------------------------------------------------------------------------
  # "trimesh>=",
  # "open3d>=",
  # "pymeshlab>=",

  # -----------------------------------------------------------------------------
  # GUI/visualization/logging dependencies
  # -----------------------------------------------------------------------------
  "rich>=14.1.0",
  "lazy-loader>=0.4",
  "networkx>=3.3",
  "ipywidgets>=8.1.5",
  "matplotlib>=3.8.0",
  "plotly>=6.3.0",
  "kaleido>=1.0.0",
  "pyvista>=0.48.0",

  # -----------------------------------------------------------------------------
  # Experimental dependencies
  # -----------------------------------------------------------------------------
  "scikit-learn>=1.7.1",
  "h5py>=3.16.0",

  # -----------------------------------------------------------------------------
  # MATLAB dependencies
  # -----------------------------------------------------------------------------
  # "matlabengine==25.2.2", # For MATLAB version 2025b
]

# ──────────────────────────────────────────────────────────────────────────────
# Optional dependencies
# ──────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
gpu = [
  "cupy-cuda13x>=13.6.0",
  "pytorch>=2.9.0", # +cu130
  "torchvision>=0.24.0", # +cu130
  "cutensor-cu13>=2.3.0",
  "nvidia-nccl-cu13>=2.27.0",
]
xnat = [
  "xnat>=0.7.2",
  "pyyaml>=6.0",
  "keyring>=24.0.0",
]
conda-packages = [
  # NOTE: pip extras cannot express "install from conda channels".
  # Use the repo's `environment.yml` to install these conda-only deps:
  # - freeimage>=3.18.0 (conda-forge)
  # - mrtrix3>=3.0.8 (mrtrix3)
  # - libstdcxx-ng>=15.2.0 (conda-forge)
]
test = [
  "pytest>=8.3.5",
]
cluster = [
  "paramiko>=3.4.0",
]
full = ["nvitk[gpu,xnat,test,cluster]"]

# ──────────────────────────────────────────────────────────────────────────────
# Scripts
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
# -----------------------------------------------------------------------------
# Conversion scripts
# -----------------------------------------------------------------------------
dcm2nii = "nvitk.io.conversors.dcm2nii:main"
stl2nifti = "nvitk.io.conversors.stl2nifti:main"
phase2volume = "nvitk.io.conversors.phase2volume:main"
nikon2nifti = "nvitk.io.conversors.nikon2nifti:main"

# -----------------------------------------------------------------------------
# Segmentation scripts
# -----------------------------------------------------------------------------
nvitk-totalseg = "nvitk.segmentation.total_segmentator.cli:main"

# -----------------------------------------------------------------------------
# Miscellaneous scripts
# -----------------------------------------------------------------------------
pyhelp = "nvitk.util.list_cli_commands:main"

# -----------------------------------------------------------------------------
# Pipeline scripts
# -----------------------------------------------------------------------------
nvitk-pesa-fat       = "nvitk.pipes.pesa_fat.run_batch:main"
nvitk-pesa-fat-ctpet = "nvitk.pipes.pesa_fat.ct_pet_v5.run:main"
nvitk-pesa-fat-dixon = "nvitk.pipes.pesa_fat.dixon_v5.run:main"
nvitk-pesa-fat-hotspot = "nvitk.pipes.pesa_fat.run_hotspot:main"

# -----------------------------------------------------------------------------
# GUI scripts
# -----------------------------------------------------------------------------
[project.gui-scripts]
# nvitk-gui = "gui.main:main"

# ──────────────────────────────────────────────────────────────────────────────
# Setuptools configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "test"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvitk", "nvitk.*"]  

[tool.poetry]
packages = [
  { include = "nvitk", from = "src" },
  { include = "nvitk.*", from = "src" },
]