# ──────────────────────────────────────────────────────────────────────────────
# Project configuration
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvitk"
version = "0.1.0"
description = "Neuro-Vascular Imaging ToolKit"
authors = [
  { name = "Ignacio Marcos Serrano", email = "imarcoss@cnic.es" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["3D", "biomedical", "mesh", "imaging", "neuroimaging", "vascular", "mri", "ct", "pet"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: Open Source"
]

# ──────────────────────────────────────────────────────────────────────────────
# Dependencies
# ──────────────────────────────────────────────────────────────────────────────
dependencies = [
  # -----------------------------------------------------------------------------
  # Core dependencies
  # -----------------------------------------------------------------------------
  "numpy>=2.3.3",                 # Array processing
  "scipy>=1.15.3",                # Scientific computing + Image processing
  "pandas>=2.3.2",                # Dataframe processing
  "polars>=1.43.2",               # Dataframe processing (faster than pandas)
  "pyarrow>=21.0.0",              # Arrow file format
  "click>=8.2.1",                 # Command line interface
  "jupyter>=1.1.1",               # Jupyter Notebook
  "ipywidgets>=8.1.5",            # Interactive widgets for Jupyter
  "openpyxl>=3.1.5",              # Excel file processing
  "lazy-loader>=0.4",             # Lazy loading of modules

  # -----------------------------------------------------------------------------
  # Visualization/Plotting/Logging dependencies
  # -----------------------------------------------------------------------------
  "matplotlib>=3.8.0",            # Plotting
  "plotly>=6.3.0",                # Interactive Plotting
  "kaleido>=1.0.0",               # Plotly image renderer
  "pyvista>=0.48.0",              # 3D plotting
  "seaborn>=0.13.2",              # Statistical data visualization
  "rich>=14.1.0",                 # Rich text formatting for logging
  "trame>=3.6.0",                 # Trame for web-based visualization
  "trame-vtk>=2.5.8,<2.11.9",     # Trame VTK for 3D plotting

  # -----------------------------------------------------------------------------
  # Image processing dependencies
  # -----------------------------------------------------------------------------
  # ────────────────────────────── IO dependencies ──────────────────────────────
  "imageio>=2.37.0",               # Image IO
  "pillow>=11.0.0",                # Simple image processing (PNG / JPEG / TIFF / etc.)
  "nibabel>=5.3.2",                # NIfTI file processing
  "tifffile>=2025.5.26",           # TIFF file processing
  "nd2>=0.10.3",                   # ND2 file processing
  "dicom2nifti>=2.6.1",            # DICOM to NIfTI conversion
  # "pydicom==3.0.1",                # DICOM file processing
  "pylibjpeg>=2.0.1",              # JPEG image processing
  "h5py>=3.16.0",                  # HDF5 file processing

  # ─────────────────────────── General dependencies ────────────────────────────
  "scikit-image>=0.25.2",          # Scikit-image for image processing
  "opencv-python>=4.11",           # OpenCV for image processing
  "vtk>=9.3.1",                    # VTK image processing
  "SimpleITK==2.2.1",              # SimpleITK for SimpleITK-based image processing
  
  # ────────────────────────── Neuroimaging tools ───────────────────────────────
  "antspyx>=0.6.3",                # ANTsPy for ANTs-based image processing
  "nilearn>=0.11.0",               # Neuroimaging data analysis
  "nipype>=1.11.0",                # Neuroimaging data analysis
  "gudhi>=3.12.0",                 # Gudhi for topological data analysis
  "antspynet>=0.3.2",              # AntsPyNet for ANTs-based image processing
  # "pyradiomics==3.0.1",          # Radiomics analysis

  # ────────────────────────── Segmentation tools ───────────────────────────────
  "totalsegmentator>=2.11.0",      # TotalSegmentator nnUNetv2-based segmentation
  "nnunetv2>=2.6.2",               # nnUNetv2 segmentation

  # ────────────────────────── Registration tools ───────────────────────────────
  "fireants>=1.5.0",               # Fireants for ANTs-based image processing

  # -----------------------------------------------------------------------------
  # Machine Learning / Statistics dependencies
  # -----------------------------------------------------------------------------
  "pingouin>=0.6.1",               # Statistical analysis
  "networkx>=3.3",                 # Graph processing
  "scikit-learn>=1.7.1",           # Machine learning
  "scikit-posthocs>=0.14.0",       # Statistical post-hoc tests
  "semopy>=2.3.11",                # Structural Equation Modeling
  
  # -----------------------------------------------------------------------------
  # API / Database dependencies
  # -----------------------------------------------------------------------------
  "xnat>=0.7.2",                   # XNAT API
  "pyyaml>=6.0",                   # YAML file processing
  "paramiko>=3.4.0",               # SSH client for remote server access
  "fastapi>=0.110.0",              # FastAPI for API development
  "uvicorn>=0.27.0",               # ASGI server for FastAPI
  "keyring>=24.0.0",               # Password management for keyring

  # -----------------------------------------------------------------------------
  # Mesh processing dependencies
  # -----------------------------------------------------------------------------
  # "trimesh>=",
  # "open3d>=",
  # "pymeshlab>=",
]

# ──────────────────────────────────────────────────────────────────────────────
# Optional dependencies
# ──────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]
# ──────────────────────── Debug and Testing tools ─────────────────────────────
dev = [
  "pytest>=9.0.3",
  "debugpy>=1.8.16",
  "sphinx>=9.0.4",
  "sphinx-autoapi>=3.8.0",
  "myst-parser>=5.1.0",
  "sphinx-click>=6.2.0",
  "pydata-sphinx-theme>=0.20.0",
  "sphinx-design>=0.6.1",
  "sphinx-copybutton>=0.5.2",
  "interrogate>=1.7.0",
]
# ──────────────────────── GUI dependencies ──────────────────────────────────────
gui = [
  "napari[all]>=0.7.0",
  "magicgui>=0.8.0",
  "superqt>=0.6.0",
  "PyQt6-WebEngine>=6.11.0",
]

# ──────────────────────── MATLAB dependencies ──────────────────────────────────
matlab = [
  "matlabengine==25.2.2",      # MATLAB engine for MATLAB version 2025b
]

# ──────────────────────────────────────────────────────────────────────────────
# Pixi configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.pixi.project]
channels = ["conda-forge", "mrtrix3", "bioconda", "defaults"]
platforms = ["linux-64"]    #, "osx-64", "win-64"]

# ──────────────────────────────────────────────────────────────────────
# Conda-only dependencies
# ──────────────────────────────────────────────────────────────────────
[tool.pixi.dependencies]
mrtrix3 = ">=3.0.8"
freeimage = ">=3.18.0"
libstdcxx-ng = ">=15.2.0"

[tool.pixi.pypi-dependencies]
nvitk = { path = ".", editable = true }
pyradiomics = "==3.0.1"
pydicom = "==3.0.1"

# pyradiomics/pydicom keep the special build handling install.sh used to do by hand
[tool.pixi.pypi-options]
no-build-isolation = ["pyradiomics", "pydicom"]

# ──────────────────────── GPU Features ──────────────────────────────────────
[tool.pixi.feature.gpu]
channels = ["morpheme", "mosaic", "nvidia", "pytorch"]   # additive to project channels

[tool.pixi.feature.gpu.dependencies]
python = ">=3.11"
numpy = ">=2.3.3"

[tool.pixi.feature.gpu.pypi-dependencies]
torch = {version = ">=2.9.0", index = "https://download.pytorch.org/whl/cu130"}
torchvision = {version = ">=0.24.0", index = "https://download.pytorch.org/whl/cu130"}
cupy-cuda13x = ">=13.6.0"
cutensor-cu13 = ">=2.6.0"
nvidia-nccl-cu13 = ">=2.27.0"

# ──────────────────────── R Features ──────────────────────────────────────
[tool.pixi.feature.stats]
channels = ["conda-forge", "bioconda", "defaults", "ejolly"]

[tool.pixi.feature.stats.dependencies]
r-base = ">=4.3.0"
r-lme4 = "*"
r-lmertest = "*"
r-mmrm = "*"
r-emmeans = "*"
r-parameters = "*"
r-performance = "*"
r-report = "*"
r-tibble = "*"
r-broom = "*"
r-broom-mixed = "*"
r-insight = "*"
r-robustbase = "*"       
rpy2 = ">=3.6.0"
pymer4 = ">=0.9.2"

[tool.pixi.feature.stats.pypi-dependencies]
great-tables = "*"
formulae = "*"

[tool.pixi.environments]
default = { features = [] }
gui     = { features = ["gui"] }
gpu     = { features = ["gui","gpu"] }
stats   = { features = ["gui","stats"] }
dev     = { features = ["gui","gpu","stats","dev"] }
all     = { features = ["gui", "gpu", "stats"] }

[tool.pixi.tasks]
verify = "pyhelp --no-interactive"
test   = "pytest tests/"
docs   = "sphinx-build -b html docs docs/_build/html"

# ──────────────────────────────────────────────────────────────────────────────
# CLI Commands
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
# -----------------------------------------------------------------------------
# Conversion scripts
# -----------------------------------------------------------------------------
dcm2nii = "nvitk.io.conversors.dcm2nii:main"
stl2nifti = "nvitk.io.conversors.stl2nifti:main"
phase2volume = "nvitk.io.conversors.phase2volume:main"
nikon2nifti = "nvitk.io.conversors.nikon2nifti:main"

# -----------------------------------------------------------------------------
# Segmentation scripts
# -----------------------------------------------------------------------------
nvitk-totalseg = "nvitk.segmentation.total_segmentator.cli:main"
nvitk-eicab = "nvitk.segmentation.eicab.cli:main"
nvitk-seg = "nvitk.cli.segmentation:main"

# -----------------------------------------------------------------------------
# Registration scripts
# -----------------------------------------------------------------------------
nvitk-flirt = "nvitk.registration.cli:main"
nvitk-ants = "nvitk.cli.ants:main"
nvitk-fireants = "nvitk.cli.fireants:main"

# -----------------------------------------------------------------------------
# Image module CLIs (filters, morphology, restoration, measure, transform)
# -----------------------------------------------------------------------------
nvitk-morph = "nvitk.cli.morphology:main"
nvitk-restore = "nvitk.cli.restoration:main"
nvitk-filter = "nvitk.cli.filters:main"
nvitk-measure = "nvitk.cli.measure:main"
nvitk-transform = "nvitk.cli.transform:main"

# -----------------------------------------------------------------------------
# Miscellaneous scripts
# -----------------------------------------------------------------------------
pyhelp = "nvitk.util.list_cli_commands:main"
nvitk-xnat-sync = "nvitk.db.xnat:main"
nvitk-xnat-pipeline-sync = "nvitk.db.xnat_pipeline_resources:main"

# -----------------------------------------------------------------------------
# Pipeline scripts
# -----------------------------------------------------------------------------
# ────────────────────────────── PESA-Fat pipelines ───────────────────────────
nvitk-pesa-fat       = "nvitk.pipes.pesa_fat.run_batch:main"
nvitk-pesa-fat-ctpet = "nvitk.pipes.pesa_fat.ct_pet_v5.run:main"
nvitk-pesa-fat-dixon = "nvitk.pipes.pesa_fat.dixon_v5.run:main"
nvitk-pesa-fat-hotspot = "nvitk.pipes.pesa_fat.run_hotspot:main"
nvitk-pesa-fat-qc = "nvitk.pipes.pesa_fat.common.stage4_qc:main"
nvitk-pesa-fat-qc-portal = "nvitk.pipes.pesa_fat.qc.portal_cli:main"
nvitk-pesa-fat-sync-measurements = "nvitk.pipes.pesa_fat.sync_measurements:main"

# ────────────────── PESA-Brain cohort pipelines (bbtpy / gpetpy) ─────────────
nvitk-bbtpy = "nvitk.pipes.bbtpy.run:main"
nvitk-qvtpy = "nvitk.pipes.qvtpy.run:main"
nvitk-qvtpy-flowshow = "nvitk.pipes.qvtpy.run_flowshow:main"
nvitk-qvtpy-xnat-upload = "nvitk.pipes.qvtpy.xnat_upload:main"
nvitk-qvtpy-autoqc = "nvitk.pipes.qvtpy.stage9_autoqc:main"

# -----------------------------------------------------------------------------
# GUI scripts
# -----------------------------------------------------------------------------
nvitk-gui = "nvitk.gui.main:main"
nvitk-statsmodels = "nvitk.gui.panels.statmodels.cli:main"

# ──────────────────────────────────────────────────────────────────────────────
# Napari manifest
# ──────────────────────────────────────────────────────────────────────────────
[project.entry-points."napari.manifest"]
nvitk = "nvitk.gui:napari.yaml"

# ──────────────────────────────────────────────────────────────────────────────
# pytest configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "test"]

# ──────────────────────────────────────────────────────────────────────────────
# Setuptools configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["nvitk", "nvitk.*"]

[tool.setuptools.package-data]
"nvitk.gui" = ["napari.yaml"]

[tool.poetry]
packages = [
  { include = "nvitk", from = "src" },
  { include = "nvitk.*", from = "src" },
]
